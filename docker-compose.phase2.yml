# =============================================================================
# IceDataEmphasise Phase 2 - MinIO, Elasticsearch, Kibana
# =============================================================================
# Docker Compose for Phase 2 infrastructure services.
# Start with: docker compose -f docker-compose.phase2.yml up -d
# =============================================================================

services:
  # --- MinIO S3-compatible object storage ---
  minio:
    image: minio/minio:latest
    container_name: cribl-minio
    restart: unless-stopped
    ports:
      - "9100:9000"    # S3 API
      - "9101:9001"    # MinIO Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --- Elasticsearch 8.12 ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: cribl-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.name=icedataemphasise
      - node.name=es-node-01
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  # --- Kibana ---
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: cribl-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ELASTICSEARCH_HOSTS: '["http://host.docker.internal:9200"]'
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "a3FkL9mNp2qR7sT0uVwXyZ1bC4dE6fXY"
      XPACK_SECURITY_ENCRYPTIONKEY: "a3FkL9mNp2qR7sT0uVwXyZ1bC4dE6fXY"
      XPACK_REPORTING_ENCRYPTIONKEY: "a3FkL9mNp2qR7sT0uVwXyZ1bC4dE6fXY"
      TELEMETRY_ENABLED: "false"
      SERVER_HOST: "0.0.0.0"
      SERVER_NAME: "icedataemphasise-kibana"
      MONITORING_UI_CONTAINER_ELASTICSEARCH_ENABLED: "true"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # --- Docs Nginx server (with reverse proxy to backend services) ---
  docs-server:
    image: nginx:alpine
    container_name: cribl-docs
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/404.html:/usr/share/nginx/errors/404.html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  minio_data:
    driver: local
  es_data:
    driver: local
