<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Seite nicht gefunden | ITSO Documentation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            max-width: 560px;
            padding: 2rem;
        }
        h1 {
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: #bee3f8;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #cbd5e0;
        }
        a.btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            transition: background 0.2s;
        }
        a.btn:hover { background: rgba(255,255,255,0.25); }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Seite nicht gefunden</h2>
        <p>Die angeforderte Seite existiert nicht oder wurde verschoben.
           Kehren Sie zur Dokumentationsuebersicht zurueck.</p>
        <a class="btn" href="/">Zur Startseite</a>
    </div>
</body>
</html>
