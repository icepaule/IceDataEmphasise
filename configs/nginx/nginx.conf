worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;

    # --- Gzip compression ---
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    server {
        listen 0.0.0.0:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # --- Security headers ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --- No cache for HTML pages (always fresh) ---
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # --- Cache static assets ---
        location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            expires 1h;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # --- Serve .env for credential auto-loading (mounted separately) ---
        location = /.env {
            alias /usr/share/nginx/env/.env;
            default_type text/plain;
        }

        # --- Reverse proxies for backend services ---
        # Ollama AI on ki01
        location /proxy/ollama/ {
            proxy_pass http://10.10.0.210:11434/;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # Elasticsearch (local)
        location /proxy/es/ {
            proxy_pass http://10.10.0.100:9200/;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }

        # Cribl Stream
        location /proxy/cribl/ {
            proxy_pass http://10.10.0.100:9000/;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }

        # Kibana
        location /proxy/kibana/ {
            proxy_pass http://host.docker.internal:5601/;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        # Splunk REST API
        location /proxy/splunk-api/ {
            proxy_pass https://10.10.0.66:8089/;
            proxy_set_header Host $host;
            proxy_set_header Origin "";
            proxy_set_header Referer "";
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
            proxy_ssl_verify off;
        }

        # --- Custom 404 ---
        error_page 404 /errors/404.html;
        location = /errors/404.html {
            root /usr/share/nginx;
            internal;
        }
    }
}
